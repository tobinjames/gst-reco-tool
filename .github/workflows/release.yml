# Publishes the Loader as a GitHub Release when a version tag is pushed (e.g. v0.10).
# The release carries the built HTML as GST_Reco_Loader_<tag>.html, so the built file does not live in the repo.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: loader/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp dist/index.html "GST_Reco_Loader_${TAG}.html"
          gh release create "$TAG" "GST_Reco_Loader_${TAG}.html" --title "Loader ${TAG}" --generate-notes
