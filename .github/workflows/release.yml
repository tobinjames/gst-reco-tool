# Publishes the Loader as a GitHub Release, with the built HTML as GST_Reco_Loader_<tag>.html
# (so the built file does not live in the repo). Two ways to start it:
# - push a version tag (e.g. v0.10), or
# - Actions tab -> Release -> Run workflow, and type the version: the tag is created on the chosen branch's latest commit.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, e.g. v0.10'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: loader/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cp dist/index.html "GST_Reco_Loader_${TAG}.html"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "GST_Reco_Loader_${TAG}.html" --clobber
          else
            gh release create "$TAG" "GST_Reco_Loader_${TAG}.html" --target "$GITHUB_SHA" --title "Loader ${TAG}" --generate-notes
          fi
